# Trip Concierge · 17-service mesh for cohort Session 6.
#
# Spin up:   docker compose up --build
# Tear down: docker compose down -v
# Healthcheck: ./scripts/preflight.sh
#
# Service tiers:
#   tier 0 · infra      · redis, phoenix
#   tier 1 · mock APIs  · mock-airline, mock-hotel, mock-payment
#   tier 2 · workers    · the 9 A2A-speaking agents
#   tier 3 · planner    · Plan-and-Execute supervisor
#   tier 4 · voice      · Gemini Live front-end
#   tier 5 · frontend   · Next.js dashboard

name: agentic-ai-multiagent-orchestration

# ─── reusable env block applied to every Python agent ───
x-agent-env: &agent-env
  REDIS_URL: redis://redis:6379/0
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY required in .env}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-agentic-ai-multiagent-orchestration}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# ─── reusable service base applied to every Python agent ───
x-agent-base: &agent-base
  build:
    context: .
    dockerfile: docker/agent.Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - tripnet
  depends_on:
    redis:
      condition: service_healthy
    phoenix:
      condition: service_started

services:
  # ════════════════ tier 0 · infra ════════════════
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks: [tripnet]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]
    environment:
      PHOENIX_WORKING_DIR: /tmp/phoenix
    networks: [tripnet]

  # ════════════════ tier 1 · MCP servers (typed tool surfaces) ════════════════
  # Non-reasoning services that expose tools via MCP streamable-http.
  # Consumed by A2A sub-agents (Phase 2+) and the Planner directly (Phase 3+).
  mcp-airline:
    <<: *agent-base
    command: uvicorn services.mcp_servers.airline.main:app --host 0.0.0.0 --port 9011
    ports: ["9011:9011"]
    environment:
      <<: *agent-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9011/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-hotel:
    <<: *agent-base
    command: uvicorn services.mcp_servers.hotel.main:app --host 0.0.0.0 --port 9012
    ports: ["9012:9012"]
    environment:
      <<: *agent-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9012/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-trip-state:
    <<: *agent-base
    command: uvicorn services.mcp_servers.trip_state.main:app --host 0.0.0.0 --port 9015
    ports: ["9015:9015"]
    environment:
      <<: *agent-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9015/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-payment:
    <<: *agent-base
    command: uvicorn services.mcp_servers.payment.main:app --host 0.0.0.0 --port 9013
    ports: ["9013:9013"]
    environment:
      <<: *agent-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9013/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-calendar:
    <<: *agent-base
    command: uvicorn services.mcp_servers.calendar.main:app --host 0.0.0.0 --port 9014
    ports: ["9014:9014"]
    environment:
      <<: *agent-env
      GOOGLE_TOKEN_PATH: /app/secrets/google-token.json
      GOOGLE_CREDS_PATH: /app/secrets/google-creds.json
    volumes:
      - ./secrets/google-token.json:/app/secrets/google-token.json:ro
      - ./secrets/google-creds.json:/app/secrets/google-creds.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9014/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ════════════════ tier 2 · A2A worker agents ════════════════
  flight-agent:
    <<: *agent-base
    command: uvicorn services.flight_agent.main:app --host 0.0.0.0 --port 8010
    ports: ["8010:8010"]
    environment:
      <<: *agent-env
      MCP_AIRLINE_URL: http://mcp-airline:9011/mcp
      FLIGHT_AGENT_PUBLIC_URL: http://flight-agent:8010/
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }
      mcp-airline: { condition: service_healthy }

  hotel-agent:
    <<: *agent-base
    command: uvicorn services.hotel_agent.main:app --host 0.0.0.0 --port 8011
    ports: ["8011:8011"]
    environment:
      <<: *agent-env
      MCP_HOTEL_URL: http://mcp-hotel:9012/mcp
      HOTEL_AGENT_PUBLIC_URL: http://hotel-agent:8011/
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }
      mcp-hotel: { condition: service_healthy }

  itinerary-agent:
    <<: *agent-base
    command: uvicorn services.itinerary_agent.main:app --host 0.0.0.0 --port 8012
    ports: ["8012:8012"]
    environment:
      <<: *agent-env
      MCP_TRIP_STATE_URL: http://mcp-trip-state:9015/mcp
      ITINERARY_AGENT_PUBLIC_URL: http://itinerary-agent:8012/
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }
      mcp-trip-state: { condition: service_healthy }

  critic-agent:
    <<: *agent-base
    command: uvicorn services.critic_agent.main:app --host 0.0.0.0 --port 8015
    ports: ["8015:8015"]
    environment:
      <<: *agent-env

  todo-agent:
    <<: *agent-base
    command: uvicorn services.todo_agent.main:app --host 0.0.0.0 --port 8016
    ports: ["8016:8016"]
    environment:
      <<: *agent-env
      MCP_TRIP_STATE_URL: http://mcp-trip-state:9015/mcp
      TODO_AGENT_PUBLIC_URL: http://todo-agent:8016/
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }
      mcp-trip-state: { condition: service_healthy }

  research-agent:
    <<: *agent-base
    command: uvicorn services.research_agent.main:app --host 0.0.0.0 --port 8018
    ports: ["8018:8018"]
    environment:
      <<: *agent-env

  # ════════════════ tier 3 · planner (supervisor) ════════════════
  planner:
    <<: *agent-base
    command: uvicorn services.planner.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    environment:
      <<: *agent-env
      # A2A sub-agents · each speaks the a2a-sdk protocol with Agent Card
      # at /.well-known/agent-card.json. Planner reaches them via the
      # delegate_to_<agent>_agent @tools (see shared/a2a_helpers/client.py).
      FLIGHT_AGENT_A2A_URL:    http://flight-agent:8010/
      HOTEL_AGENT_A2A_URL:     http://hotel-agent:8011/
      RESEARCH_AGENT_A2A_URL:  http://research-agent:8018/
      CRITIC_AGENT_A2A_URL:    http://critic-agent:8015/
      ITINERARY_AGENT_A2A_URL: http://itinerary-agent:8012/
      TODO_AGENT_A2A_URL:      http://todo-agent:8016/
      # MCP servers · the Planner calls these DIRECTLY (no agent layer ·
      # deterministic non-reasoning operations: budget, payment, calendar).
      # See planner's _ensure_mcp_tools() / _call_mcp() in main.py.
      MCP_TRIP_STATE_URL:      http://mcp-trip-state:9015/mcp
      MCP_PAYMENT_URL:         http://mcp-payment:9013/mcp
      MCP_CALENDAR_URL:        http://mcp-calendar:9014/mcp
    depends_on:
      redis:            { condition: service_healthy }
      phoenix:          { condition: service_started }
      flight-agent:     { condition: service_started }
      hotel-agent:      { condition: service_started }
      itinerary-agent:  { condition: service_started }
      critic-agent:     { condition: service_started }
      todo-agent:       { condition: service_started }
      research-agent:   { condition: service_started }
      mcp-trip-state:   { condition: service_healthy }
      mcp-payment:      { condition: service_healthy }
      mcp-calendar:     { condition: service_healthy }

  # ════════════════ tier 4 · voice front-end ════════════════
  concierge-voice:
    <<: *agent-base
    command: uvicorn services.concierge_voice.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      <<: *agent-env
      PLANNER_URL: http://planner:8001
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live}
      CONCIERGE_VOICE_NAME: ${CONCIERGE_VOICE_NAME:-Charon}
    depends_on:
      planner: { condition: service_started }

  # ════════════════ tier 5 · frontend ════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_VOICE_WS_URL: ws://localhost:8000/voice
      NEXT_PUBLIC_AGENT_URL:    http://localhost:8001/agent
      NEXT_PUBLIC_TTS_URL:      http://localhost:8000/tts/stream
    networks: [tripnet]
    depends_on:
      concierge-voice: { condition: service_started }
      planner:         { condition: service_started }

networks:
  tripnet:
    driver: bridge
