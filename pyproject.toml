[project]
name = "agentic-ai-multiagent-orchestration"
version = "0.0.1"
description = "Multi-agent service mesh demo for cohort Session 6."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "websockets>=13",

    # http client (A2A peer calls)
    "httpx>=0.27",

    # state
    "redis>=5.2",

    # LLM + agents
    "google-genai>=0.3",          # Gemini Live + Gemini API
    "google-cloud-texttospeech>=2.16",  # Cloud TTS Streaming (low-latency)
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",

    # Multi-agent protocols (Session 6 refactor)
    "a2a-sdk>=1.1.0",                   # Google's A2A protocol · agent-to-agent comms
    "mcp>=1.27.2",                      # MCP server SDK · FastMCP for tool servers
    "langchain-mcp-adapters>=0.2.2",    # MultiServerMCPClient · binds MCP tools as LangChain tools

    # observability · Phase 8 cross-service tracing
    "arize-phoenix>=5.0",
    "arize-phoenix-otel>=0.6",              # `register()` helper · wires OTLP HTTP exporter to Phoenix
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-instrumentation-fastapi>=0.48",   # inbound HTTP spans + traceparent extract
    "opentelemetry-instrumentation-httpx>=0.48",     # outbound HTTP spans + traceparent inject
    "langsmith>=0.1",
]

[project.optional-dependencies]
# notebooks/ 09 + 10 act as clients of the running stack. Install with:
#   uv sync --extra notebooks
notebooks = [
    "jupyter>=1.1.0",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["services", "shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
