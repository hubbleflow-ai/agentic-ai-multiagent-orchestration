[project]
name = "agentic-ai-multiagent-orchestration"
version = "0.0.1"
description = "Multi-agent service mesh demo for cohort Session 6."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "websockets>=13",

    # http client (A2A peer calls)
    "httpx>=0.27",

    # state
    "redis>=5.2",

    # LLM + agents
    "google-genai>=0.3",          # Gemini Live + Gemini API
    "google-cloud-texttospeech>=2.16",  # Cloud TTS Streaming (low-latency)
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",

    # observability
    "arize-phoenix>=5.0",
    "openinference-instrumentation-langchain>=0.1",
    "langsmith>=0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["services", "shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
